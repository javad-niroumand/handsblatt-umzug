<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#000;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:2rem 0;position:relative;}
#cognigy-prison{position:fixed;top:0;left:-9999px;width:260px;height:200px;pointer-events:none;z-index:1;opacity:0;}
.shell{width:375px;height:812px;background:#000;border-radius:52px;box-shadow:0 0 0 2px #3a3a3c,0 0 0 5px #1c1c1e,0 30px 80px rgba(0,0,0,.6);position:relative;overflow:hidden;flex-shrink:0;z-index:10;}
.screen{position:absolute;inset:0;border-radius:52px;overflow:hidden;display:flex;flex-direction:column;}
.wp{position:absolute;inset:0;background:url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg') center/cover no-repeat;z-index:0;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:34px;background:#000;border-radius:0 0 22px 22px;z-index:50;}
.sb{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:14px 24px 4px;color:#fff;font-size:15px;font-weight:600;font-family:-apple-system,sans-serif;}
.sb-r{display:flex;align-items:center;gap:6px;}
.bars-sb{display:flex;align-items:flex-end;gap:2px;}
.bar-sb{width:3px;background:#fff;border-radius:1px;}
.hc{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;padding:0 0 20px;}
.dw{text-align:center;padding:26px 0 10px;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;}
.dd{font-size:29px;font-weight:600;letter-spacing:.1px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);margin-bottom:4px;}
.dn{font-size:108px;font-weight:600;line-height:1;letter-spacing:-2px;color:transparent;
  background-image:linear-gradient(135deg,rgba(255,255,255,.9) 0%,rgba(255,255,255,.3) 10%,rgba(255,255,255,.08) 28%,rgba(255,255,255,.4) 52%,rgba(255,255,255,.1) 100%),url('iClarified-iOS27-Celosia-Color-LockScreen.jpeg');
  background-size:375px 814.75px,375px 814.75px;background-repeat:no-repeat;background-position:0 0,0 -104.375px;
  -webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0.6px rgba(255,255,255,.55);
  filter:brightness(1.8) saturate(1.5) contrast(1.15) blur(0.4px);text-shadow:0 3px 8px rgba(0,0,0,.45);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);align-content:start;gap:18px 10px;padding:16px 22px;flex:1;}
.ai{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;}
.ic{width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.al{font-size:11px;color:#fff;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:400;font-family:-apple-system,sans-serif;}
.dock{background:rgba(255,255,255,.15);backdrop-filter:blur(20px);border-radius:26px;margin:0 16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.di{width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;}
.hi{width:134px;height:5px;background:rgba(255,255,255,.35);border-radius:3px;margin:8px auto 0;display:block;}

/* ── Notification banner ── */
#nb{position:absolute;top:50px;left:16px;right:16px;z-index:200;border-radius:20px;background:rgba(28,28,30,.92);backdrop-filter:blur(30px);padding:14px 16px;transform:translateY(-160px);opacity:0;transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .55s ease;pointer-events:none;font-family:-apple-system,sans-serif;}
#nb.show{transform:translateY(0);opacity:1;pointer-events:all;}
.nt{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.nai{width:32px;height:32px;border-radius:8px;background:#451DC7;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nai i{font-size:17px;color:#fff;}
.nan{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;letter-spacing:.3px;text-transform:uppercase;}
.ntm{font-size:12px;color:rgba(255,255,255,.4);margin-left:auto;}
.ntit{font-size:16px;font-weight:600;color:#fff;margin-bottom:3px;}
.nbod{font-size:14px;color:rgba(255,255,255,.7);line-height:1.4;}
.nact{display:flex;gap:8px;margin-top:12px;}
#btn-annehmen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:#34c759;color:#fff;position:relative;z-index:5;}
#btn-ablehnen{flex:1;padding:10px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif;background:rgba(255,255,255,.12);color:#fff;}

/* ── Call screen ── */
#co{
  position:absolute;inset:0;z-index:300;
  background:linear-gradient(175deg,#f5f4f9 0%,#edeaf5 55%,#e8e4f2 100%);
  display:none;flex-direction:column;border-radius:52px;
  font-family:-apple-system,sans-serif;overflow:hidden;
}
#co.active{display:flex;}

/* Default call view — light */
#co-default{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 30px 55px;width:100%;height:100%;}
.caller-name{font-size:32px;font-weight:600;color:#1a1035;letter-spacing:-.5px;margin-bottom:8px;text-align:center;}
.caller-status{font-size:13px;color:#7c6fb0;font-weight:500;letter-spacing:0.3px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
.caller-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#34c759;display:inline-block;box-shadow:0 0 0 2px rgba(52,199,89,.25);animation:livePulse 2s ease-in-out infinite;}
#sphere-canvas{display:block;border-radius:50%;}

/* ── SCENE VIEW — light mode ── */
#co-scene{
  display:none;flex-direction:column;width:100%;height:100%;
  padding:48px 0 0;
  background:linear-gradient(175deg,#f5f4f9 0%,#edeaf5 55%,#e8e4f2 100%);
}
#co-scene.active{display:flex;}

/* Top header bar */
.scene-caller-head{
  text-align:center;flex-shrink:0;
  padding:0 24px 16px;
  border-bottom:1px solid rgba(100,80,200,.08);
  position:relative;
}
.scene-caller-name{
  font-size:20px;font-weight:600;
  color:#1a1035;letter-spacing:-.3px;margin-bottom:2px;
}
.scene-caller-status{
  font-size:12px;font-weight:500;
  color:#6c5f9e;letter-spacing:0.5px;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.scene-caller-status::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:#34c759;display:inline-block;
  box-shadow:0 0 0 2px rgba(52,199,89,.25);
  animation:livePulse 2s ease-in-out infinite;
}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 2px rgba(52,199,89,.25);}50%{box-shadow:0 0 0 5px rgba(52,199,89,.08);}}

/* Sphere zone — compact, biased toward center */
.sphere-zone{
  flex:0 0 auto;
  height:152px;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

/* Context badge — sits between sphere zone and action feed */
#sceneContextBadge{
  display:flex;align-items:center;gap:6px;
  align-self:center;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(10px);
  border:1px solid rgba(100,80,200,.12);
  border-radius:20px;
  padding:5px 14px 5px 8px;
  box-shadow:0 2px 12px rgba(80,60,160,.1);
  opacity:0;
  flex-shrink:0;
  margin:6px auto 0;
  transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.56,.64,1);
  transform:translateY(6px);
  pointer-events:none;
  white-space:nowrap;
}
#sceneContextBadge.show{
  opacity:1;
  transform:translateY(0);
}
.ctx-icon{
  width:22px;height:22px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.ctx-icon svg{width:13px;height:13px;}
.ctx-label{font-size:11px;font-weight:700;letter-spacing:.2px;}

/* Floating context icon chips in sphere zone (decorative) */
.ctx-chip{
  position:absolute;
  width:32px;height:32px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
  opacity:0;
  transition:opacity .5s ease;
  pointer-events:none;
}
.ctx-chip.show{opacity:1;}
.ctx-chip svg{width:16px;height:16px;}

/* Scene-to-default transition */
#co-scene{
  transition:opacity .5s ease;
}
#co-scene.fading{
  opacity:0;
  pointer-events:none;
}

/* ── Action feed card ── */
.action-feed{
  flex:1;display:flex;flex-direction:column;
  margin:14px 16px 0;
  background:#fff;
  border-radius:22px;
  border:1px solid rgba(100,80,200,.1);
  box-shadow:0 2px 18px rgba(80,60,160,.08),0 1px 3px rgba(80,60,160,.06);
  overflow:hidden;
  padding:14px 16px 12px;
  gap:10px;
}

/* Feed header row */
.feed-header{display:flex;align-items:center;justify-content:space-between;height:36px;flex-shrink:0;}
.feed-side{display:flex;align-items:center;gap:7px;transition:opacity .3s ease;}
.feed-side.dim{opacity:.3;}

.feed-side-icon{
  width:30px;height:30px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:12px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#7c5cfc,#5234c4);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease;
  box-shadow:0 2px 8px rgba(100,70,220,.3);
}
.feed-side-icon i{font-size:14px;}
.feed-side-icon.active{
  transform:scale(1.08);
  box-shadow:0 0 0 3px rgba(124,92,252,.2),0 2px 12px rgba(100,70,220,.35);
}
.feed-side-label{font-size:11px;color:#8878b0;font-weight:600;letter-spacing:.2px;}

.feed-exchange{flex:1;display:flex;justify-content:center;align-items:center;padding:0 8px;min-width:0;}
.feed-exchange-track{
  position:relative;width:100%;height:1.5px;
  background:repeating-linear-gradient(90deg,rgba(100,80,200,.2) 0 4px,transparent 4px 9px);
  border-radius:1px;
}
.feed-exchange-dot{
  position:absolute;top:50%;left:0;width:8px;height:8px;border-radius:50%;
  background:#5234c4;transform:translate(0,-50%);opacity:0;
  box-shadow:0 0 6px 1px rgba(82,52,196,.5);
}
.feed-exchange-dot.running{opacity:1;animation:exchangeMove 2.2s ease-in-out infinite;}
@keyframes exchangeMove{0%{left:0;transform:translate(0,-50%);}50%{left:100%;transform:translate(-100%,-50%);}100%{left:0;transform:translate(0,-50%);}}

.feed-divider{height:1px;background:rgba(100,80,200,.08);flex-shrink:0;}

/* Steps list */
.feed-steps{display:flex;flex-direction:column;gap:6px;flex:1;overflow:hidden;}
.feed-step{
  display:flex;align-items:flex-start;gap:9px;
  padding:5px 0;
  transition:opacity .25s ease;
}
.feed-step i{font-size:12px;flex-shrink:0;margin-top:2px;}
.feed-step.done i{color:#34c759;}
.feed-step.current i{color:#5234c4;}
.feed-step.fail i{color:#c0b8d8;}
.feed-step.warn i{color:#d4820a;}
.feed-step-text{font-size:12.5px;line-height:1.45;font-weight:500;}
.feed-step.done .feed-step-text{color:#a09abc;}
.feed-step.current .feed-step-text{color:#1a1035;font-weight:600;}
.feed-step.fail .feed-step-text{color:#b8b0d0;}
.feed-step.warn .feed-step-text{color:#9a5a08;}
.feed-step.a2a .feed-step-text::before{
  content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#5234c4;margin-right:4px;vertical-align:1px;opacity:.7;
}

/* ── Call controls — scene (light) ── */
#co-scene .cac{
  flex-shrink:0;
  display:flex;justify-content:space-around;width:100%;
  align-items:center;
  padding:12px 24px 28px;
  background:transparent;
}
#co-scene .cbw{text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;}
#co-scene .cbi{
  width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,box-shadow .2s;
}
#co-scene .cbi:active{transform:scale(.91);}
#co-scene .cbi i{font-size:20px;}
#co-scene .cbl{font-size:10px;color:#8878b0;font-weight:500;}
#co-scene .cbr{background:#ff3b30;box-shadow:0 4px 16px rgba(255,59,48,.35);}
#co-scene .cbr i{color:#fff;}
#co-scene .cbg{
  background:#fff;
  border:1px solid rgba(100,80,200,.15);
  box-shadow:0 2px 10px rgba(80,60,160,.1);
}
#co-scene .cbg i{color:#5234c4;}

/* Default view controls — light */
#co-default .cac{display:flex;justify-content:space-around;width:100%;align-items:center;flex-shrink:0;margin-top:0;}
#co-default .cbw{text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
#co-default .cbi{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .2s;}
#co-default .cbi:active{transform:scale(.92);}
#co-default .cbi i{font-size:26px;}
#co-default .cbr{background:#ff3b30;box-shadow:0 4px 18px rgba(255,59,48,.35);}
#co-default .cbr i{color:#fff;}
#co-default .cbg{background:#fff;border:1px solid rgba(100,80,200,.15);box-shadow:0 2px 12px rgba(80,60,160,.1);}
#co-default .cbg i{color:#5234c4;}
#co-default .cbl{font-size:12px;color:#8878b0;font-weight:500;}

/* Overlay layer */
#overlayLayer{position:absolute;inset:0;z-index:400;pointer-events:none;}
#overlayLayer:not(:empty){pointer-events:all;}

/* ── Carousel overlay — transparent top, frosted sheet bottom ── */
.carousel-overlay{
  position:absolute;inset:0;
  background:transparent;      /* sphere visible through the top half */
  z-index:100;display:flex;flex-direction:column;justify-content:flex-end;
  pointer-events:none;         /* top area passes clicks through */
}
.carousel-box{
  pointer-events:all;
  background:rgba(250,248,255,.96);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border-radius:28px 28px 0 0;
  padding:16px 0 32px;
  box-shadow:0 -6px 32px rgba(80,60,160,.13);
}
.carousel-title{
  text-align:center;font-size:10px;color:#a098c8;
  font-weight:700;letter-spacing:1px;margin-bottom:14px;
  text-transform:uppercase;
}
.track-wrap{overflow:hidden;padding:0 18px;}
.track{display:flex;transition:transform .52s cubic-bezier(.4,0,.2,1);}

/* Card */
.offer-card{flex:0 0 100%;box-sizing:border-box;padding:0 5px;}
.offer-inner{
  border-radius:20px;
  overflow:hidden;
  position:relative;
  box-shadow:0 4px 20px rgba(80,60,160,.1);
}
/* coloured accent top stripe — set via inline style on each card */
.offer-accent{
  height:5px;width:100%;
}
.offer-body{
  background:#fff;
  padding:14px 16px 14px;
}
.offer-inner.rec .offer-body{
  background:linear-gradient(160deg,#f4f0ff 0%,#ece6ff 100%);
}

/* badge */
.offer-badge{
  display:inline-flex;align-items:center;gap:3px;
  font-size:9px;font-weight:800;letter-spacing:.4px;
  padding:3px 9px;border-radius:20px;
  margin-bottom:8px;
  text-transform:uppercase;
}
/* badge colours set inline per card */

/* hero price */
.offer-hero{
  display:flex;align-items:baseline;gap:3px;
  margin-bottom:4px;
}
.offer-hero-num{
  font-size:28px;font-weight:800;letter-spacing:-1px;color:#1a1035;
  line-height:1;
}
.offer-hero-unit{font-size:11px;font-weight:600;color:#9888c0;line-height:1;padding-bottom:2px;}

.offer-title{font-size:13px;font-weight:700;color:#1a1035;margin-bottom:1px;letter-spacing:-.1px;}
.offer-sub{font-size:10.5px;color:#a098c8;margin-bottom:10px;font-weight:500;}

/* icon + rows layout */
.offer-icon-row{display:flex;align-items:flex-start;gap:10px;}
.offer-icon{
  width:36px;height:36px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:2px;
}
.offer-icon svg{width:20px;height:20px;}
.offer-rows{flex:1;display:flex;flex-direction:column;gap:0;}
.offer-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:5px 0;border-bottom:1px solid rgba(100,80,200,.07);
}
.offer-row:last-child{border-bottom:none;}
.offer-row span{font-size:11px;}
.offer-row span:first-child{color:#b0a8cc;font-weight:500;}
.offer-row span:last-child{color:#1a1035;font-weight:700;}

/* timed progress bar */
.carousel-progress{
  position:relative;height:2.5px;
  background:rgba(100,80,200,.1);
  margin:14px 18px 0;border-radius:2px;overflow:hidden;
}
.carousel-progress-fill{
  position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg,#7c5cfc,#5234c4);
  border-radius:2px;
  /* width animated by JS requestAnimationFrame — no CSS transition here */
}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px;}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(100,80,200,.18);
  transition:all .35s cubic-bezier(.4,0,.2,1);
}
.dot.active{background:#5234c4;width:20px;border-radius:3px;}

/* ── Approval overlay — light ── */
.approval-overlay{
  position:absolute;inset:0;
  background:rgba(235,230,252,.65);
  backdrop-filter:blur(20px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:0 18px;
}
.approval-card{
  background:#fff;border-radius:22px;padding:20px;width:100%;
  border:1px solid rgba(100,80,200,.12);
  box-shadow:0 8px 32px rgba(80,60,160,.12),0 2px 8px rgba(80,60,160,.06);
}
.approval-title{font-size:13px;font-weight:700;color:#1a1035;margin-bottom:14px;letter-spacing:-.1px;}
.approval-row{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid rgba(100,80,200,.07);
}
.approval-row:last-of-type{border-bottom:none;}
.approval-row i{font-size:14px;flex-shrink:0;}
.approval-row.ok i{color:#34c759;}
.approval-row.manual i{color:#c0b8d8;}
.approval-text{font-size:11.5px;color:#3a2f6a;font-weight:500;line-height:1.35;}
.approval-btn{
  margin-top:16px;width:100%;padding:12px;border-radius:14px;border:none;
  background:linear-gradient(135deg,#6b44f8,#4620d4);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  letter-spacing:-.1px;
  box-shadow:0 4px 16px rgba(82,52,196,.35);
  transition:transform .15s,box-shadow .2s;
}
.approval-btn:active{transform:scale(.97);box-shadow:0 2px 8px rgba(82,52,196,.3);}

/* ── AVA Umzug additions ── */
.feed-step.wait i{color:#d4820a;}
.feed-step.wait .feed-step-text{color:#9a5a08;}
.feed-step.current i{animation:spinPulse 1s linear infinite;}
@keyframes spinPulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.feed-step-body{display:flex;flex-direction:column;min-width:0;}
.feed-step-src{font-size:10px;color:#b8b0d0;font-weight:600;letter-spacing:.2px;margin-top:1px;}
.feed-step.fail .feed-step-src,.feed-step.wait .feed-step-src{color:#c4a878;}
.feed-step.punch .feed-step-text{color:#1a1035;font-weight:700;}
.approval-text small{display:block;font-size:10px;color:#a098c8;font-weight:500;margin-top:1px;}
.sum-foot{margin-top:12px;text-align:center;font-size:11px;font-weight:700;color:#5234c4;letter-spacing:.3px;}

.call-card{display:flex;align-items:center;gap:12px;margin:0 18px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 4px 20px rgba(80,60,160,.1);}
.call-avatar{width:42px;height:42px;border-radius:14px;background:#ede8ff;color:#5234c4;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.call-card.live .call-avatar{background:#d1fae5;color:#059669;}
.call-main{flex:1;min-width:0;}
.call-status{font-size:13px;font-weight:700;color:#1a1035;}
.call-sub{font-size:10.5px;color:#a098c8;font-weight:500;margin-top:2px;}
.call-dots{display:flex;gap:4px;}
.call-dots span{width:6px;height:6px;border-radius:50%;background:#5234c4;opacity:.3;animation:dotBlink 1.2s infinite;}
.call-dots span:nth-child(2){animation-delay:.2s}.call-dots span:nth-child(3){animation-delay:.4s}
@keyframes dotBlink{0%,100%{opacity:.25}50%{opacity:1}}
.call-mute{display:flex;flex-direction:column;align-items:center;gap:2px;color:#b9770e;font-size:9px;font-weight:700;}
.call-mute i{font-size:16px;}

.mail-card{margin:0 18px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 4px 20px rgba(80,60,160,.1);}
.mail-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.mail-ico{width:34px;height:34px;border-radius:11px;background:#ede8ff;color:#5234c4;display:flex;align-items:center;justify-content:center;font-size:17px;}
.mail-from{font-size:11px;font-weight:700;color:#1a1035;}
.mail-subj{font-size:11px;color:#6a5fa0;font-weight:500;}
.mail-link{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:10px;background:#f5f2ff;font-size:10.5px;color:#5234c4;font-weight:600;}
.mail-check{display:flex;gap:6px;align-items:center;margin-top:9px;font-size:10.5px;font-weight:600;color:#a098c8;}
.mail-check.ok{color:#059669;}

.ph-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 18px;}
.ph{position:relative;aspect-ratio:1;border-radius:12px;background:linear-gradient(145deg,#e9e4fb,#d9d1f5);color:#8878b0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:opacity .4s,transform .4s;}
.ph i{font-size:20px;}
.ph em{font-style:normal;font-size:9px;font-weight:600;}
.ph.none{opacity:.45;}
.ph.skip{opacity:.55;}
.ph.sel{box-shadow:0 0 0 2px #34c759;}
.ph-mark{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;}
.ph-mark.ok{background:#34c759;}.ph-mark.no{background:#b0a8cc;}
.ph-foot{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;font-size:10.5px;font-weight:600;color:#8878b0;}
.ph-foot.ok{color:#059669;}

/* photo gallery with real photos + submit step */
.ph{overflow:hidden;}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;}
.ph em{position:relative;z-index:1;}
.ph img + em{position:absolute;left:0;right:0;bottom:0;padding:10px 4px 3px;text-align:center;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(20,10,50,.55));border-radius:0 0 12px 12px;}
.ph.sel{box-shadow:0 0 0 2.5px #34c759;}
.ph-mark{z-index:2;}
.ph-mark.done{background:#0f9d58;}
.ph.sending img{animation:phPulse 1s ease-in-out infinite;}
@keyframes phPulse{0%,100%{opacity:1}50%{opacity:.55}}
.ph-bar{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:3px;background:rgba(255,255,255,.45);z-index:3;overflow:hidden;}
.ph-bar span{display:block;height:100%;width:0;background:#fff;border-radius:3px;animation:phFill 2.2s ease-out forwards;}
@keyframes phFill{from{width:0}to{width:100%}}
.ph-foot.sub{color:#5234c4;}
.ph-foot.sub i{animation:phPulse 1s ease-in-out infinite;}

/* ─────────────────────────────────────────────
   SCENE DEFINITIONS · AVA Umzug (script v1)
   Actions = the sendMetadata payloads of flow
   "Versicherungen & Umzug" (9d3e28e9-f37a-4b0d-9fc8-46957642798c).
   Tune all timings (ms) in TIMING.
───────────────────────────────────────────── */
var TIMING = {
  row: 1000,          // a normal row: working -> done
  rowHold: 900,       // pause after a row is done
  a2aStep: 1300,      // one leg of an agent-to-agent exchange
  search: 2500,       // "Agent endpoint ... searching" spinner (script: 2.5 s)
  failHold: 1600,     // grey X stays
  faxDelay: 500,      // script: punchline lands 0.5 s after the beat ...
  faxHold: 6000,      // ... and stays up longer
  offersHold: 14000,  // offer cards visible
  hotlineDial: 2500,
  hotlineQueue: 12000,   // = jingle length (10-15 s)
  hotlineLive: 8000,
  summaryHold: 9000
};
var STEP_WINDOW = 4;   // how many rows stay visible in the data room

var PARTNERS = {
  roadwise: { logo: 'R', logoColor: '#e60000', logoLabel: 'Roadwise Direct' },
  vitalis:  { logo: 'V', logoColor: '#0a84ff', logoLabel: 'Vitalis Health' },
  homeshield: { logo: 'H', logoColor: '#0f6e56', logoLabel: 'Homeshield' },
  meridian: { logo: 'M', logoColor: '#5b6b8c', logoLabel: 'Meridian' },
  sterling: { logo: 'S', logoColor: '#0f6e56', logoLabel: 'Sterling' },
  halcyon:  { logo: 'H', logoColor: '#f0a830', logoLabel: 'Halcyon' }
};

/* rows -> cumulative animation frames */
function buildSeq(rows, opts) {
  opts = opts || {};
  var shown = (opts.pre || []).map(function (r) {
    return { text: r.text, state: r.state || 'done', src: r.src, status: r.status, a2a: r.a2a };
  });
  var frames = [];
  function snap() { return shown.slice(-(opts.window || STEP_WINDOW)).map(function (s) { return Object.assign({}, s); }); }
  function push(extra, d) {
    frames.push(Object.assign({ steps: snap(), noPartner: true, duration: d }, extra));
  }
  rows.forEach(function (r) {
    if (r.only) shown = [];
    var row = { text: r.text, state: 'current', src: r.src, a2a: !!r.a2a };
    shown.push(row);
    var ov = r.overlay ? { overlay: r.overlay } : {};
    if (r.a2a) {
      var p = PARTNERS[r.p];
      var base = { noPartner: false, logo: p.logo, logoColor: p.logoColor, logoLabel: p.logoLabel };
      push(Object.assign({}, base, { speaker: 'mine', exchange: true }), TIMING.a2aStep);
      push(Object.assign({}, base, { speaker: 'partner', exchange: true }), TIMING.a2aStep);
      row.state = 'done';
      push(Object.assign({}, base, { speaker: 'partner', exchange: false, pulse: true }, ov), r.hold || TIMING.rowHold);
    } else if (r.fail) {
      push({}, r.search || TIMING.search);
      row.state = 'fail'; row.status = r.status || 'unavailable';
      push(ov, r.hold || TIMING.failHold);
    } else if (r.wait) {
      row.state = 'wait'; row.status = r.status || 'manual / waiting';
      push(ov, r.hold || TIMING.rowHold);
    } else {
      push(r.workOverlay ? { overlay: r.workOverlay } : {}, r.work || TIMING.row);
      row.state = 'done';
      push(Object.assign({}, ov, r.punch ? { punch: true } : {}), r.hold || TIMING.rowHold);
    }
  });
  (opts.tail || []).forEach(function (f) {
    frames.push(Object.assign({ steps: snap(), noPartner: true }, f));
  });
  return frames;
}

var scenes = [

  {

      { text: 'Agent endpoint Bürgeramt: searching …', state: 'fail', src: 'Agent directory', status: 'unavailable' },
      { text: 'Alternative contact channel found: fax', src: 'Authority directory' }
    ] })
  },
  {

    noPartnerAtAll: true, isLast: true,
    animatedSequence: buildSeq([
      { text: 'Overall status: 3 topics, 1 automatic, 2 manual', src: 'AVA', hold: 800 }

var returnTimer = null;

function showContextBadge(ctx) {
  var badge = document.getElementById('sceneContextBadge');
  var iconEl = document.getElementById('ctxIcon');
  var labelEl = document.getElementById('ctxLabel');

  if (!ctx || !contextMap[ctx]) {
    badge.classList.remove('show');
    return;
  }
  var c = contextMap[ctx];

  // badge
  badge.style.background = 'rgba(255,255,255,.9)';
  badge.style.borderColor = c.border + '44';
  iconEl.style.background = c.iconBg;
  iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="' + c.iconColor + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;">' + c.svg.replace(/<svg[^>]*>/, '').replace('</svg>','') + '</svg>';
  // re-inject svg properly
  iconEl.innerHTML = c.svg.replace('<svg ', '<svg style="width:13px;height:13px;" ').replace('stroke="currentColor"', 'stroke="' + c.iconColor + '"');
  labelEl.textContent = c.label;
  labelEl.style.color = c.text;

  setTimeout(function(){ badge.classList.add('show'); }, 80);
}

function hideContextBadge() {
  var badge = document.getElementById('sceneContextBadge');
  badge.classList.remove('show');
}

function returnToDefault() {
  var scene = document.getElementById('co-scene');
  var def   = document.getElementById('co-default');

  hideContextBadge();
  stopCarousel();
  stopExchange();

  scene.classList.add('fading');
  setTimeout(function() {
    scene.classList.remove('active');
    scene.classList.remove('fading');

    // move canvas back and resize
    sc.width = 210; sc.height = 210;
    CX = 105; CY = 105; R = 86;
    def.appendChild(sc);
    def.style.display = '';
    sceneActive = false;
    sphereColorMode = 'default';
    document.getElementById('overlayLayer').innerHTML = '';
    document.getElementById('feedSteps').innerHTML = '';
  }, 500);
}

function renderSteps(list) {
  var el = document.getElementById('feedSteps');
  el.innerHTML = '';
  var iconMap = { done: 'ti-check', current: 'ti-point-filled', fail: 'ti-x', warn: 'ti-alert-triangle', wait: 'ti-clock' };
  list.forEach(function(s) {
    var row = document.createElement('div');
    row.className = 'feed-step ' + s.state + (s.a2a ? ' a2a' : '');
    var meta = [s.src, s.status].filter(Boolean).join(' · ');
    row.innerHTML = '<i class="ti ' + iconMap[s.state] + '"></i><div class="feed-step-body"><span class="feed-step-text">' + s.text + '</span>' +
      (meta ? '<span class="feed-step-src">' + meta + '</span>' : '') + '</div>';
    el.appendChild(row);
  });
}

function clearSceneTimers() {
  sceneTimers.forEach(function(t) { clearTimeout(t); });
  sceneTimers = [];
}

function startExchange() {
  document.getElementById('exchangeDot').classList.add('running');
}

function stopExchange() {
  document.getElementById('exchangeDot').classList.remove('running');
}

function setHeaderVisible(visible) {
  document.getElementById('feedSideMine').style.display  = visible ? 'flex' : 'none';
  document.getElementById('feedExchange').style.display  = visible ? 'flex' : 'none';
  document.getElementById('feedSidePartner').style.display = visible ? 'flex' : 'none';
}

function setSpeaker(s, speaker, pulse) {
  var mineIcon    = document.getElementById('feedMineIcon');
  var partnerIcon = document.getElementById('feedLogo');
  var mineSide    = document.getElementById('feedSideMine');
  var partnerSide = document.getElementById('feedSidePartner');

  partnerIcon.style.background = s.logoColor;
  if (s.logo) {
    partnerIcon.textContent = s.logo;
  } else if (s.logoIcon) {
    partnerIcon.innerHTML = '<i class="ti ' + s.logoIcon + '" style="font-size:14px;color:#fff"></i>';
  } else {
    partnerIcon.textContent = '';
  }
  document.getElementById('feedPartnerLabel').textContent = s.logoLabel || 'Provider';

  mineIcon.classList.toggle('active',    speaker === 'mine');
  partnerIcon.classList.toggle('active', speaker === 'partner');
  mineSide.classList.toggle('dim',    speaker === 'partner');
  partnerSide.classList.toggle('dim', speaker === 'mine');

  if (pulse) {
    var el = speaker === 'partner' ? partnerIcon : mineIcon;
    el.style.transform = 'scale(1.25)';
    setTimeout(function() { el.style.transform = 'scale(1)'; }, 350);
  }
}

function playSequence(s) {
  var seq = s.animatedSequence;
  var i = 0;
  var current = s;
  function step() {
    if (i >= seq.length) {
      // last frame finished — schedule return if this is the final scene
      if (s.isLast) {
        if (returnTimer) clearTimeout(returnTimer);
        returnTimer = setTimeout(returnToDefault, 5000);
      }
      return;
    }
    var frame = seq[i];
    if (frame.logoColor) {
      current = Object.assign({}, current, {
        logo: frame.logo, logoIcon: frame.logoIcon,
        logoColor: frame.logoColor, logoLabel: frame.logoLabel
      });
    }
    renderSteps(frame.steps);
    setHeaderVisible(!frame.noPartner);
    if (!frame.noPartner) setSpeaker(current, frame.speaker || 'mine', frame.pulse || false);
    if (frame.exchange && !frame.noPartner) startExchange(); else stopExchange();
    if (frame.openCarousel) showCarousel();
    if (frame.openSummary) showSummary();
    if (frame.overlay) showOverlay(frame.overlay);
    if (frame.punch) { var rows = document.querySelectorAll('#feedSteps .feed-step'); if (rows.length) rows[rows.length - 1].classList.add('punch'); }
    var t = setTimeout(function() { i++; step(); }, frame.duration);
    sceneTimers.push(t);
  }
  step();
}

/* Switch phone UI from default call view → scene view */
function activateScene(idx) {
  var s = scenes[idx];
  if (!s) return;

  stopHoldJingle(true);
  clearSceneTimers();
  stopExchange();
  stopCarousel();
  if (returnTimer) { clearTimeout(returnTimer); returnTimer = null; }
  document.getElementById('overlayLayer').innerHTML = '';

  // Move canvas into scene sphere zone (only on first switch)
  if (!sceneActive) {
    var zone = document.getElementById('sceneSphereZone');
    zone.appendChild(sc);
    // Resize canvas for the fixed 160px sphere zone
    sc.width  = 150;
    sc.height = 150;
    CX = 75; CY = 75; R = 62;
    sceneActive = true;
  }

  // Swap views
  document.getElementById('co-default').style.display = 'none';
  document.getElementById('co-scene').classList.add('active');

  // Context badge
  showContextBadge(s.context || null);

  // Set sphere color based on scene
  if (s.action === 'agentsearch') sphereColorMode = 'warning';
  else sphereColorMode = 'default';

  // Run scene
  if (s.noPartnerAtAll && s.animatedSequence) {
    setHeaderVisible(false);
    playSequence(s);
  } else if (s.noPartnerAtAll) {
    setHeaderVisible(false);
    renderSteps(s.steps || []);
  } else if (s.animatedSequence) {
    setHeaderVisible(true);
    playSequence(s);
  } else {
    setHeaderVisible(true);
    setSpeaker(s, 'mine', false);
    if (s.exchangeActive) startExchange();
    renderSteps(s.steps || []);
  }

  if (s.carousel && !s.animatedSequence) showCarousel();
  if (s.approval && !s.animatedSequence) showApproval();
}

function showPhotos(state) {
  /* 3 real damage photos (selected) + 3 other moving-day photos (not selected) */
  var tiles = [
    { cls: 'none', label: 'Kitchen' },
    { cls: 'sel',  label: 'Wardrobe',  img: 'damage/damage-1.jpg' },
    { cls: 'none', label: 'Boxes' },
    { cls: 'sel',  label: 'Close-up',  img: 'damage/damage-2.jpg' },
    { cls: 'skip', label: 'Thumb' },
    { cls: 'sel',  label: 'Wall',      img: 'damage/damage-3.jpg' }
  ];
  var chosen = state !== 'search';
  var grid = tiles.map(function (t) {
    var mark = '';
    if (chosen) {
      if (t.cls === 'sel') {
        mark = state === 'upload'
          ? '<span class="ph-mark done"><i class="ti ti-cloud-check"></i></span>'
          : '<span class="ph-mark ok"><i class="ti ti-check"></i></span>';
      }
      if (t.cls === 'skip') mark = '<span class="ph-mark no"><i class="ti ti-x"></i></span>';
    }
    var klass = 'ph ' + (chosen ? t.cls : '') + (state === 'submit' && t.cls === 'sel' ? ' sending' : '');
    var body = t.img
      ? '<img src="' + t.img + '" alt="">'
      : '<i class="ti ti-photo"></i>';
    return '<div class="' + klass + '">' + body + '<em>' + t.label + '</em>' + mark +
      (state === 'submit' && t.cls === 'sel' ? '<span class="ph-bar"><span></span></span>' : '') + '</div>';
  }).join('');
  var foot;
  if (state === 'upload')      foot = '<div class="ph-foot ok"><i class="ti ti-circle-check"></i><span>Submitted to Hartwell · 3 photos + description</span></div>';
  else if (state === 'submit') foot = '<div class="ph-foot sub"><i class="ti ti-cloud-upload"></i><span>Submitting 3 photos to Hartwell …</span></div>';
  else if (state === 'select') foot = '<div class="ph-foot"><i class="ti ti-sparkles"></i><span>3 photos with visible damage selected</span></div>';
  else                         foot = '<div class="ph-foot"><i class="ti ti-loader-2"></i><span>Searching photos from moving day …</span></div>';
  sheet('Photo gallery', '<div class="ph-grid">' + grid + '</div>' + foot);
}

/* ── Hold-music jingle (original composition, ~12 s) ──────────────────
   Plays while the call sits in the claims queue ("hotline:queue") and
   fades out when Ms Becker picks up. To use your own licensed file
   instead, set JINGLE.src, e.g. 'hold-jingle.mp3' (put it next to the page). */
var JINGLE = {
  enabled: true,
  src: 'hold-jingle.m4a',   // '' = use the built-in synthesized tune instead
  startAt: 0,                 // seconds into the file to start from
  maxMs: 12000,               // play at most this long (10-15 s), then fade out
  fadeMs: 1200,
  volume: 0.5
};
var holdNodes = null, holdAudioEl = null, holdAudioTimer = null, holdFadeTimer = null;

function holdJingle(state) {
  if (!JINGLE.enabled) return;
  if (state === 'queue') startHoldJingle(); else stopHoldJingle(true);
}

function startHoldJingle() {
  if (holdNodes || holdAudioEl) return;
  try {
    if (JINGLE.src) {
      var el = new Audio(JINGLE.src);
      holdAudioEl = el;
      el.volume = JINGLE.volume;
      function fallback() { if (holdAudioEl === el) { holdAudioEl = null; clearTimeout(holdAudioTimer); startSynthJingle(); } }
      el.addEventListener('error', fallback);
      el.addEventListener('loadedmetadata', function () {
        try { if (JINGLE.startAt) el.currentTime = Math.min(JINGLE.startAt, Math.max(0, el.duration - 1)); } catch (e) {}
      });
      var pr = el.play();
      if (pr && pr.catch) pr.catch(function () { fallback(); });
      holdAudioTimer = setTimeout(function () { stopHoldJingle(true); }, JINGLE.maxMs - JINGLE.fadeMs);
      return;
    }
    startSynthJingle();
  } catch (e) { console.warn('[AVA] jingle', e); }
}

function startSynthJingle() {
  try {
    unlockAudio();
    if (!audioCtx) return;
    var BEAT = 0.6, t0 = audioCtx.currentTime + 0.05;
    var master = audioCtx.createGain();
    var hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
    var lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';  lp.frequency.value = 3400;   /* "phone line" colour */
    master.gain.value = 0.0;
    master.connect(hp); hp.connect(lp); lp.connect(audioCtx.destination);
    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(JINGLE.volume * 0.45, t0 + 0.25);

    var F = { C3:130.81, F3:174.61, G3:196.00, C4:261.63, E4:329.63, F4:349.23, G4:392.00,
              A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25 };
    function tone(freq, start, dur, type, vol) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; o.connect(g); g.connect(master);
      var s = t0 + start * BEAT, d = dur * BEAT;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(vol, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.start(s); o.stop(s + d + 0.05);
      holdNodes.osc.push(o);
    }
    holdNodes = { osc: [], master: master };

    /* 5 bars x 4 beats = 12 s at 100 bpm: a light, slightly nervous waiting-room tune */
    var melody = [
      ['E4',0,1],['G4',1,1],['C5',2,1],['G4',3,1],
      ['F4',4,1],['A4',5,1],['D5',6,1],['A4',7,1],
      ['G4',8,1],['B4',9,1],['E5',10,1],['D5',11,1],
      ['C5',12,1],['B4',13,1],['A4',14,1],['G4',15,1],
      ['E4',16,2],['C4',18,2]
    ];
    melody.forEach(function (m) { tone(F[m[0]], m[1], m[2] * 0.9, 'triangle', 0.5); });
    [['C3',0],['C3',2],['F3',4],['F3',6],['G3',8],['G3',10],['C3',12],['G3',14],['C3',16]].forEach(function (b) {
      tone(F[b[0]], b[1], 1.6, 'sine', 0.55);
    });
    /* soft clock tick on every beat */
    var nbuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.03, audioCtx.sampleRate);
    var nd = nbuf.getChannelData(0);
    for (var i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 3);
    for (var b = 0; b < 20; b++) {
      var src = audioCtx.createBufferSource(), g = audioCtx.createGain();
      src.buffer = nbuf; g.gain.value = 0.12; src.connect(g); g.connect(master);
      src.start(t0 + b * BEAT); holdNodes.osc.push(src);
    }
    /* natural end: fade over the last second */
    master.gain.setValueAtTime(JINGLE.volume * 0.45, t0 + 20 * BEAT - 1.0);
    master.gain.linearRampToValueAtTime(0, t0 + 20 * BEAT);
    holdNodes.timer = setTimeout(function () { stopHoldJingle(false); }, 20 * BEAT * 1000 + 300);
  } catch (e) { console.warn('[AVA] jingle', e); }
}

function stopHoldJingle(fade) {
  try {
    clearTimeout(holdAudioTimer);
    if (holdAudioEl) {
      var el2 = holdAudioEl; holdAudioEl = null;
      var steps = fade ? 12 : 1, i2 = 0, v0 = el2.volume;
      clearInterval(holdFadeTimer);
      holdFadeTimer = setInterval(function () {
        i2++; el2.volume = Math.max(0, v0 * (1 - i2 / steps));
        if (i2 >= steps) { clearInterval(holdFadeTimer); el2.pause(); }
      }, fade ? JINGLE.fadeMs / 12 : 10);
    }
    if (holdNodes) {
      var n = holdNodes; holdNodes = null;
      clearTimeout(n.timer);
      var now = audioCtx.currentTime, ramp = fade ? 0.4 : 0.02;
      n.master.gain.cancelScheduledValues(now);
      n.master.gain.setValueAtTime(n.master.gain.value, now);
      n.master.gain.linearRampToValueAtTime(0, now + ramp);
      setTimeout(function () { n.osc.forEach(function (o) { try { o.stop(); } catch (e) {} }); }, ramp * 1000 + 60);
    }
  } catch (e) {}
}

function setupCarousel() {
  var track  = document.getElementById('track');
  var dotsEl = document.getElementById('dots');
  var wrap   = document.getElementById('trackWrap');
  var fill   = document.getElementById('cpFill');
  var total  = 3;
  var SLIDE_MS = 3400;          // time per slide in ms
  var index  = 0;
  var paused = false;
  var elapsed = 0;              // ms elapsed on current slide
  var lastTS  = null;           // timestamp from previous RAF frame

  /* dots */
  for (var i = 0; i < total; i++) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    dotsEl.appendChild(d);
  }
  var dots = dotsEl.children;

  function updateUI() {
    track.style.transition = 'transform .52s cubic-bezier(.4,0,.2,1)';
    track.style.transform  = 'translateX(-' + (index * 100) + '%)';
    for (var i = 0; i < total; i++)
      dots[i].className = 'dot' + (i === index ? ' active' : '');
  }

  function goTo(idx) {
    index   = idx;
    elapsed = 0;
    updateUI();
  }

  /* RAF loop — drives the progress bar width and triggers slide */
  function tick(ts) {
    carouselRAF = requestAnimationFrame(tick);
    if (!lastTS) { lastTS = ts; return; }
    var dt = ts - lastTS;
    lastTS = ts;
    if (!paused) {
      elapsed += dt;
      var pct = Math.min(elapsed / SLIDE_MS, 1) * 100;
      fill.style.width = pct + '%';
      if (elapsed >= SLIDE_MS) {
        elapsed = 0;
        index = (index + 1) % total;
        updateUI();
      }
    }
  }
  carouselRAF = requestAnimationFrame(tick);
  updateUI();

  /* drag */
  var startX = 0, deltaX = 0, dragging = false;
  wrap.addEventListener('pointerdown', function(e) {
    dragging = true; paused = true; elapsed = 0; fill.style.width = '0%';
    startX = e.clientX;
    track.style.transition = 'none';
    lastTS = null;
  });
  wrap.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    deltaX = e.clientX - startX;
    track.style.transform = 'translateX(calc(-' + (index * 100) + '% + ' + deltaX + 'px))';
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    if      (deltaX < -40 && index < total - 1) index++;
    else if (deltaX > 40  && index > 0)          index--;
    deltaX = 0;
    elapsed = 0;
    updateUI();
    /* resume after 3s */
    setTimeout(function() { paused = false; lastTS = null; }, 3000);
  }
  wrap.addEventListener('pointerup',     endDrag);
  wrap.addEventListener('pointerleave',  endDrag);
  wrap.addEventListener('pointercancel', endDrag);
}

/* Audio unlock: browsers only allow sound after a real gesture (click/tap/key).
   mousemove and touchstart do NOT count, so the context stayed suspended and the
   first notification chime (fired by a timer) was silent. */
var pendingChime = false;
function audioReady() { return !!audioCtx && audioCtx.state === 'running'; }
function updateSoundHint() {
  var h = document.getElementById('soundHint');
  if (h) h.classList.toggle('show', !audioReady() && !callActive);
}
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var done = function () {
      updateSoundHint();
      var nb = document.getElementById('nb');
      if (audioReady() && pendingChime && !callActive && nb && nb.classList.contains('show')) {
        pendingChime = false; playNotifSound();   /* chime that was blocked while the banner was waiting */
      }
    };
    var p = audioCtx.resume();
    if (p && p.then) p.then(done, done); else done();
  } catch (e) {}
}
['pointerdown', 'touchend', 'click', 'keydown'].forEach(function (e) {
  document.addEventListener(e, unlockAudio, true);
});
window.addEventListener('load', updateSoundHint);


function playNotifSound() {
  try {
    unlockAudio();
    if (!audioReady()) { pendingChime = true; updateSoundHint(); return; }
    var notes = [{f:1047,s:0,d:.12},{f:1319,s:.14,d:.12},{f:1568,s:.28,d:.18},
                 {f:1047,s:.55,d:.12},{f:1319,s:.69,d:.12},{f:1568,s:.83,d:.18}];
    notes.forEach(function(n) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination); o.type = 'sine';
      var t = audioCtx.currentTime + n.s;
      o.frequency.setValueAtTime(n.f, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.28, t + .02);
      g.gain.setValueAtTime(.28, t + n.d - .04);
      g.gain.linearRampToValueAtTime(0, t + n.d);
      o.start(t); o.stop(t + n.d + .01);
    });
  } catch(e) {}
}

function findBotBubble(node) {
  var el = (node.nodeType === 1) ? node : node.parentElement;
  while (el) {
    if (el.className && typeof el.className === 'string' &&
        el.className.indexOf('webrtc_transcript_bubble_bot') >= 0) return el;
    el = el.parentElement;
  }
  return null;
}

function onBotActivity(el) {
  var text = (el.textContent || '').trim();
  if (text === lastText || text === '') return;
  lastText = text;
  speaking = true;
  targetE = text.indexOf('!') !== -1 ? 0.95 : (text.indexOf('?') !== -1 ? 0.55 : 0.75);
  var dynamicDuration = Math.max(1500, text.length * 65);
  clearTimeout(speakTimer);
  speakTimer = setTimeout(function() {
    speaking = false; targetE = 0;
    // only clear lastText after a short delay so rapid identical messages aren't swallowed
    setTimeout(function() { lastText = ''; }, 200);
    sphereColorMode = 'default';
  }, dynamicDuration);
}

function startTranscriptObserver() {
  if (transcriptObs) return;
  transcriptObs = new MutationObserver(function(mutations) {
    mutations.forEach(function(m) {
      m.addedNodes.forEach(function(node) {
        if (node.nodeType !== 1) return;
        if (typeof node.className === 'string' &&
            node.className.indexOf('webrtc_transcript_bubble_bot') >= 0) {
          onBotActivity(node); return;
        }
        try {
          var inner = node.querySelector('[class*="webrtc_transcript_bubble_bot"]');
          if (inner) onBotActivity(inner);
        } catch(e) {}
      });
      if (m.type === 'characterData') {
        var bubble = findBotBubble(m.target);
        if (bubble) onBotActivity(bubble);
      }
    });
  });
  transcriptObs.observe(document.body, { childList: true, subtree: true, characterData: true });
}

/* ─────────────────────────────────────────────
   WIDGET INIT
───────────────────────────────────────────── */
window.addEventListener('load', function() {
  if (!window.initWebRTCWidget) return;
  var snap = new Set(Array.from(document.body.querySelectorAll('*')));

  var btnObs = new MutationObserver(function() {
    if (cognigyBtn) return;
    var btns = document.querySelectorAll('button,[role="button"]');
    for (var i = 0; i < btns.length; i++) {
      var btn = btns[i];
      if (!snap.has(btn) && !document.getElementById('myShell').contains(btn)) {
        cognigyBtn = btn;
        btnObs.disconnect();
        var root = btn.parentElement;
        try {
          var r2 = btn.closest('[class*="widget"],[class*="webrtc"],[id*="widget"],[id*="webrtc"]');
          if (r2) root = r2;
        } catch(e) {}
        if (root && root !== document.body)
          document.getElementById('cognigy-prison').appendChild(root);
        break;
      }
    }
  });
  btnObs.observe(document.body, { childList: true, subtree: true });

  window.initWebRTCWidget(
    'https://endpoint-trial.cognigy.ai/2f324835155e6badd2654ab8cf7952cc903b99682afedfb44febb73535607b96'
  ).then(function(w) {
    widgetRef = w;
    w.on('newRTCSession', function(session) {
      document.getElementById('cst').textContent = 'Connected';
      startTranscriptObserver();

      session.on('newInfo', function(infoEvent) {
        try {
          var data = JSON.parse(infoEvent.request.body);
          if (!data.action) return;

          var incoming = String(data.action).toLowerCase();
          var idx = scenes.findIndex(function(s) { return s.action.toLowerCase() === incoming; });

          if (idx !== -1) {
            activateScene(idx);
          } else {
            console.warn('[AVA] Unbekannte action:', data.action);
          }

          // Global sphere color hints from action
          if (data.action === 'approval_requested') sphereColorMode = 'warning';
          if (data.action === 'process_complete')   sphereColorMode = 'success';

        } catch(e) { console.warn('[AVA] SIP INFO parse error:', e); }
      });

      session.on('ended', function() {
        document.getElementById('cst').textContent = 'Call ended';
        if (transcriptObs) { transcriptObs.disconnect(); transcriptObs = null; }
        speaking = false; targetE = 0;
        setTimeout(endCall, 1500);
      });
    });
  }).catch(function(e) { console.error('[AVA]', e); });
});

/* ─────────────────────────────────────────────
   CANVAS SPHERE RENDER
───────────────────────────────────────────── */
function drawLoop() {
  if (!sphereRunning) return;
  animFrame = requestAnimationFrame(drawLoop);
  time += 0.016;
  var diff = targetE - smoothE;
  smoothE += diff * (diff > 0 ? 0.18 : 0.04);
  drawSphere(smoothE);
}

function drawSphere(E) {
  ctx2d.clearRect(0, 0, sc.width, sc.height);

  var c1, c2;
  if (sphereColorMode === 'success') {
    c1 = '#4fd68f'; c2 = '#0a5d34';
  } else if (sphereColorMode === 'warning') {
    c1 = '#f0a830'; c2 = '#8a4b08';
  } else {
    c1 = '#a288ff'; c2 = '#451DC7';
  }

  var idlePulse = Math.sin(time * 2) * 3;
  var baseR = (CX * 0.52) + idlePulse + (E * 25);

  ctx2d.save();
  ctx2d.translate(CX, CY);

  ctx2d.shadowBlur  = 40 + (E * 30);
  ctx2d.shadowColor = c1;
  ctx2d.globalCompositeOperation = 'screen';

  for (var j = 0; j < 3; j++) {
    ctx2d.save();
    ctx2d.rotate(time * (0.3 + j * 0.1));
    ctx2d.beginPath();
    var offset = j * (Math.PI * 2 / 3);
    for (var i = 0; i <= Math.PI * 2.1; i += 0.1) {
      var wave  = Math.sin(i * (3 + j) + time * 4 + offset);
      var spike = wave * (6 + E * 22);
      var r = baseR + spike;
      var x = Math.cos(i) * r;
      var y = Math.sin(i) * r;
      if (i === 0) ctx2d.moveTo(x, y);
      else         ctx2d.lineTo(x, y);
    }
    ctx2d.closePath();
    var grd = ctx2d.createLinearGradient(-baseR, -baseR, baseR, baseR);
    grd.addColorStop(0, c1);
    grd.addColorStop(1, c2);
    ctx2d.globalAlpha = 0.65;
    ctx2d.fillStyle   = grd;
    ctx2d.fill();
    ctx2d.restore();
  }

  ctx2d.globalCompositeOperation = 'source-over';
  ctx2d.shadowBlur  = 0;
  // On the light bg scene, draw a slightly larger, more opaque core
  var coreAlpha = sceneActive ? (E > 0.03 ? 0.55 + (E * 0.25) : 0.25) : (E > 0.03 ? 0.4 + (E * 0.3) : 0.15);
  ctx2d.globalAlpha = coreAlpha;
  ctx2d.beginPath();
  ctx2d.arc(0, 0, baseR * (sceneActive ? 0.38 : 0.4), 0, Math.PI * 2);
  ctx2d.fillStyle = sceneActive ? 'rgba(255,255,255,0.9)' : '#ffffff';
  ctx2d.fill();

  ctx2d.restore();
}
</script>
<script>
/* Preview without a live call: index_umzug.html?preview  (← → or 1-9, 0, -, = for scenes 10-12) */
(function () {
  if (!/[?&]preview/.test(location.search)) return;
  window.addEventListener('load', function () {
    document.getElementById('co').classList.add('active');
    document.getElementById('cst').textContent = 'Preview';
    var i = -1;
    function go(n) { i = (n + scenes.length) % scenes.length; activateScene(i); document.title = scenes[i].label; }
    window.__go = go;
    var m = location.search.match(/[?&]scene=(\d+)/);
    if (m) go(parseInt(m[1], 10));
    window.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') go(i + 1);
      else if (e.key === 'ArrowLeft') go(i - 1);
      else if (/^[1-9]$/.test(e.key)) go(parseInt(e.key, 10) - 1);
      else if (e.key === '0') go(9); else if (e.key === '-') go(10); else if (e.key === '=') go(11);
    });
  });
})();
</script>
